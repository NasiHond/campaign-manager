spring.application.name=Campaign-Manager
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/campaignmanager}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:campaignmanager}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:campaignmanager}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

jwt.secret=${JWT_SECRET}
jwt.expiration=PT15M
