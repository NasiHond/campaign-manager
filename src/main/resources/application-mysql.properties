spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/campaignmanager?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:campaignmanager}
